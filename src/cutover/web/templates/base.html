<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cutover{% endblock %}</title>
<meta name="description" content="Meça o estado atual dos seus dados, aprove o destino e leve o código de migração para Databricks e Microsoft Fabric. Cada número é medido, não afirmado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#14140f">
<link rel="stylesheet" href="{{ asset('ledger.css') }}">
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="page">
  <header class="nav">
    <a class="wordmark" href="/"><img src="/static/favicon.svg" alt="" width="26" height="26">Cutover</a>
    <nav class="nav-links" aria-label="Principal">
      {% if user %}
        <a href="/app">Meus datasets</a>
        <span class="mono crumb">{{ user.email }}</span>
        <form method="post" action="/logout"><button class="btn ghost small" type="submit">Sair</button></form>
      {% else %}
        <a class="hide-sm" href="/#como-funciona">Como funciona</a>
        <a class="hide-sm" href="/#governanca">Governança</a>
        <a href="/login">Entrar</a>
        <a class="btn small" href="/signup">Criar conta</a>
      {% endif %}
    </nav>
  </header>
  <div id="conteudo">{% block content %}{% endblock %}</div>
</div>
</body>
</html>
